# Koyeb deployment configuration for free-claude-code
name: free-claude-code-proxy
type: web
docker:
  dockerfile: Dockerfile
instance_type: nano
regions:
  - fra
ports:
  - port: 8080
    path: /
    protocol: http
env:
  - key: PORT
    value: "8080"
  - key: HOST
    value: "0.0.0.0"
  - key: ANTHROPIC_AUTH_TOKEN
    value: "freecc"
  - key: MODEL
    value: "groq/openai/gpt-oss-120b"
  - key: MODEL_SONNET
    value: "groq/qwen/qwen3.8-27b"
  - key: MODEL_OPUS
    value: "groq/qwen/qwen3.6-27b"
  - key: MODEL_HAIKU
    value: "groq/qwen/qwen3.8-27b"
  - key: MODEL_FABLE
    value: "open_router/minimax/minimax-m3:free"
  - key: MODEL_FALLBACKS
    value: "groq/qwen/qwen3.8-27b,groq/qwen/qwen3.6-27b,groq/openai/gpt-oss-120b,open_router/minimax/minimax-m3:free"
  - key: GROQ_API_KEY
    value: "${GROQ_API_KEY}"
  - key: OPENROUTER_API_KEY
    value: "${OPENROUTER_API_KEY}"
  - key: NVIDIA_NIM_API_KEY
    value: "${NVIDIA_NIM_API_KEY}"
health_checks:
  - http:
      path: /health
      port: 8080
    interval: 30
    timeout: 5
